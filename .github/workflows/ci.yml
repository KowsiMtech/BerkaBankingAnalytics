# .github/workflows/ci.yml
name: CI — Validate notebooks and configuration
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install nbformat pyflakes great-expectations
      - name: Scan notebooks for hardcoded paths and secrets
        run: python scripts/check_no_hardcoding.py notebooks/
      - name: Validate notebook syntax
        run: python -m pyflakes notebooks/
